name: Audit

# New advisories arrive without any file changing, so PRs only run audit when they touch dependencies (ci.yml).
# This daily run catches the rest: it lifts vulnerable packages to a patched release in the same major and opens a
# PR that merges itself once CI passes. Only a fix that needs a new major is left to a person, as an issue.
on:
  schedule:
    - cron: '0 21 * * *' # 06:00 KST, after Renovate's lockfile maintenance window
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      BRANCH: automation/audit-fix
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - id: fix
        run: node .github/scripts/audit-fix.mjs

      - id: changes
        run: |
          if git diff --quiet -- pnpm-workspace.yaml pnpm-lock.yaml; then changed=false; else changed=true; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # A PR or push made with GITHUB_TOKEN triggers no workflows, so CI is dispatched on the branch instead. Its
      # ci-ok check lands on the same commit, which is what the ruleset and auto-merge look at.
      - if: steps.changes.outputs.changed == 'true'
        env:
          TITLE: 보안 권고가 나온 의존성을 수정 버전으로 올린다
        run: |
          report="$RUNNER_TEMP/audit-report.md"
          node .github/scripts/commit-branch.mjs "$BRANCH" "$GITHUB_SHA" "$TITLE" "$report"
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$report"
          else
            gh pr create --head "$BRANCH" --base "$GITHUB_REF_NAME" --title "$TITLE" --body-file "$report"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          gh pr merge "$BRANCH" --auto --merge

      - name: Open or update the issue for what needs a person
        if: steps.fix.outputs.unresolved == 'true'
        env:
          TITLE: 의존성 보안 권고 자동 수정 실패
        run: |
          number=$(gh issue list --state open --label audit --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/audit-report.md"
          else
            gh label create audit --color B60205 --force
            gh issue create --title "$TITLE" --label audit --body-file "$RUNNER_TEMP/audit-report.md"
          fi

      - name: Close the issue once nothing needs a person
        if: steps.fix.outputs.unresolved == 'false'
        run: |
          number=$(gh issue list --state open --label audit --json number --jq '.[0].number')
          if [ -n "$number" ]; then gh issue close "$number" --comment "자동 수정으로 남은 권고가 없습니다."; fi
