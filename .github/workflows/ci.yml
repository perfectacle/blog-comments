name: CI

# Vercel's Git integration builds and deploys (PR → preview, main → production); this workflow only checks.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR runs are superseded by newer pushes; main runs always finish so every landed commit has a result.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A job whose inputs match a run that already passed skips install and run (see the fingerprint steps).
  verify:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        task: ['format:check', audit]
    env:
      # audit is time-dependent (new advisories land without any file changing), so it always runs.
      REUSE: ${{ matrix.task != 'audit' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: fingerprint
        run: echo "key=verified-${{ matrix.task }}-${{ runner.arch }}-${{ hashFiles('**', '!.git/**') }}" >> "$GITHUB_OUTPUT"

      - if: env.REUSE == 'true'
        id: verified
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .verified
          key: ${{ steps.fingerprint.outputs.key }}
          lookup-only: true

      - if: steps.verified.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup

      - if: steps.verified.outputs.cache-hit != 'true'
        run: pnpm run ${{ matrix.task }}

      - if: env.REUSE == 'true' && steps.verified.outputs.cache-hit != 'true'
        run: touch .verified

      - if: env.REUSE == 'true' && steps.verified.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .verified
          key: ${{ steps.fingerprint.outputs.key }}

  # Boots the server against the schema in waline.pgsql, so an auto-merged Waline or DiceBear update that hangs the
  # boot or breaks the comment API fails here instead of in production.
  test:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 10
    env:
      # Started by a step rather than as a service so a reused run does not pull and boot it. Renovate updates this
      # line through a customManager.
      POSTGRES_IMAGE: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
      PG_HOST: 127.0.0.1
      PG_PORT: 5432
      PG_DB: waline
      PG_USER: postgres
      PG_PASSWORD: waline
      # No outbound spam check from CI, and no per-IP rate limit between the test's own comments.
      AKISMET_KEY: 'false'
      IPQPS: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docs and agent guides cannot change what the server does.
      - id: fingerprint
        run: echo "key=verified-test-${{ runner.arch }}-${{ hashFiles('**', '!.git/**', '!**/*.md', '!.agents/**', '!.claude/**') }}" >> "$GITHUB_OUTPUT"

      - id: verified
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .verified
          key: ${{ steps.fingerprint.outputs.key }}
          lookup-only: true

      # The image runs waline.pgsql on first boot. Readiness is checked over TCP because the init server it boots
      # first listens only on the socket, then restarts.
      - if: steps.verified.outputs.cache-hit != 'true'
        run: |
          docker run -d --name postgres -p 5432:5432 -e POSTGRES_DB="$PG_DB" -e POSTGRES_PASSWORD="$PG_PASSWORD" \
            -v "$PWD/waline.pgsql:/docker-entrypoint-initdb.d/waline.sql:ro" "$POSTGRES_IMAGE"
          for _ in $(seq 30); do
            docker exec postgres pg_isready -h 127.0.0.1 -U "$PG_USER" -d "$PG_DB" -q && exit 0
            sleep 1
          done
          docker logs postgres
          exit 1

      - if: steps.verified.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup

      # Vercel's runtime only loads ES modules through require() with the flag in vercel.json's NODE_OPTIONS, and
      # Waline requires ESM-only markdown plugins. Start from the flag off and add vercel.json's value, so dropping it
      # fails here instead of taking every comment request down in production.
      - if: steps.verified.outputs.cache-hit != 'true'
        run: echo "NODE_OPTIONS=--no-experimental-require-module $(jq -r '.env.NODE_OPTIONS // ""' vercel.json)" >> "$GITHUB_ENV"

      - if: steps.verified.outputs.cache-hit != 'true'
        run: pnpm test

      - if: steps.verified.outputs.cache-hit != 'true'
        run: touch .verified

      - if: steps.verified.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .verified
          key: ${{ steps.fingerprint.outputs.key }}

  actionlint:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  zizmor:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    env:
      # One place for the version: the cache key and the run both read it, and Renovate updates it.
      ZIZMOR: zizmor==1.31.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: python
        run: |
          {
            echo "version=$(python3 --version | cut -d ' ' -f 2)"
            echo "pipx=$(pipx --version)"
            echo "venvs=$(pipx environment --value PIPX_VENV_CACHEDIR)"
            echo "pip=$(python3 -m pip cache dir)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.python.outputs.venvs }}
            ${{ steps.python.outputs.pip }}
          key: zizmor-${{ runner.os }}-${{ runner.arch }}-python-${{ steps.python.outputs.version }}-pipx-${{ steps.python.outputs.pipx }}-${{ env.ZIZMOR }}

      # Pin the interpreter too: pipx's run cache includes its Python path.
      - run: pipx run --python "$(command -v python3)" "$ZIZMOR" --format github .github
        env:
          GH_TOKEN: ${{ github.token }}

  # The one required status check on main: passes only when every job above passed.
  ci-ok:
    if: always()
    needs: [verify, test, actionlint, zizmor]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo ok
